<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chefly — Receitas e cardápios com IA</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/noscript.css" />
</head>

<body>
  <!-- Loading splash screen -->
  <div id="__bundler_thumbnail">
    <!-- SVG will be injected here by bundle-loader.js -->
    <div id="__bundler_placeholder">Carregando…</div>
  </div>

  <!-- Status indicator -->
  <div id="__bundler_loading">Unpacking...</div>

  <!-- Main application container -->
  <div id="app"></div>

  <!-- Bundle loader script -->
  <script src="js/bundle-loader.js" defer></script>

  <!-- Bundle data (manifest and template) -->
  <script type="__bundler/manifest">
    <!-- Manifest will be loaded from js/bundle-data.html -->
  </script>
  <script type="__bundler/template">
    <!-- Template will be loaded from js/bundle-data.html -->
  </script>
</body>
</html>
